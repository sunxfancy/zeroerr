name: CMake

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Check Clang warning hygiene
      if: runner.os != 'Windows'
      run: python3 scripts/check-warning-hygiene.py --compiler clang++

    - name: Configure lightweight header checks
      run: cmake -S test/lightweight -B build-lightweight -DCMAKE_BUILD_TYPE=Release
    - name: Build lightweight header checks
      run: cmake --build build-lightweight --config Release --parallel 2
    - name: Test lightweight header checks
      run: ctest --test-dir build-lightweight -C Release --output-on-failure

    - name: Configure full C++17 tests
      run: cmake -S . -B build-tests -DBUILD_TEST=ON -DBUILD_EXAMPLES=ON -DCMAKE_CXX_STANDARD=17 -DCMAKE_BUILD_TYPE=Debug
    - name: Build full tests
      run: cmake --build build-tests --config Debug --parallel 2
    - name: Run full tests
      run: ctest --test-dir build-tests -C Debug --output-on-failure

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. 
      run: bash ${{github.workspace}}/scripts/build-all.sh config ${{github.workspace}}
        
    - name: Build
      # Build your program with the given configuration
      run: bash ${{github.workspace}}/scripts/build-all.sh build ${{github.workspace}}

      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
    - name: Test
      run: bash ${{github.workspace}}/scripts/build-all.sh test ${{github.workspace}}


  compatibility:
    name: C++${{ matrix.standard }} with ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        standard: [11, 14]
        compiler: [g++, clang++]
    steps:
    - uses: actions/checkout@v4
    - name: Configure compatibility tests
      run: >-
        cmake -S . -B build-compatibility -DBUILD_TEST=ON -DBUILD_EXAMPLES=ON
        -DUSE_MOLD=OFF -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
        -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
        -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF
        -DCMAKE_CXX_FLAGS="-Werror=c++14-extensions -Werror=c++17-extensions -Werror=c++20-extensions"
    - name: Build compatibility tests
      run: cmake --build build-compatibility --parallel 2
    - name: Run compatibility tests
      run: ctest --test-dir build-compatibility --output-on-failure

  sanitizers:
    name: Domain and serialization sanitizers
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure ASan and UBSan
      run: >-
        cmake -S . -B build-sanitizers -DBUILD_TEST=ON -DUSE_MOLD=OFF
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
    - name: Build regression tests
      run: cmake --build build-sanitizers --target domain_regression domain_regression_single --parallel 2
    - name: Run regression tests with leak detection
      env:
        ASAN_OPTIONS: detect_leaks=1
        UBSAN_OPTIONS: halt_on_error=1
      run: ctest --test-dir build-sanitizers -R DomainRegression --output-on-failure
